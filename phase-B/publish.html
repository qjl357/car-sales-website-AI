<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publishing Console · Used Car Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main class="page-shell lt-shell">
    <header class="lt-topbar">
      <a class="lt-back" href="home.html" aria-label="Back to control">‹</a>
      <div class="lt-brand-block">
        <p class="lt-brand">Inventory Operations</p>
        <h1>Publishing Console</h1>
      </div>
      <nav class="lt-nav">
        <a class="lt-nav-link" href="home.html">Home</a>
        <a class="lt-nav-link active" href="publish.html">Publish</a>
        <a class="lt-nav-link" href="auth.html">Access</a>
      </nav>
    </header>

    <section class="lt-layout">
      <aside class="lt-left-panel">
        <div class="lt-left-head">
          <p class="lt-left-kicker">Inventory Task</p>
          <h2>Publish</h2>
          <p class="lt-subtitle">Complete all listing fields and submit for review to release the vehicle card.</p>
        </div>

      </aside>

      <section class="lt-right-stream">
        <article class="lt-mission-row">
          <div class="lt-mission-meta">
            <span class="lt-chip">Publishing Mission</span>
            <strong>Vehicle Data Intake</strong>
          </div>
          <div class="lt-stream-list">
            <form class="lt-form-stack" action="#" method="post">
              <section class="lt-form-stage">
                <h2 class="lt-form-head">Core Specs</h2>
                <div class="lt-field-grid two">
                  <div>
                    <label for="car-brand">Brand</label>
                    <input class="input" id="car-brand" name="brand" type="text" placeholder="e.g. Toyota">
                  </div>
                  <div>
                    <label for="car-model">Model</label>
                    <input class="input" id="car-model" name="model" type="text" placeholder="e.g. Camry 2.0G">
                  </div>
                </div>
              </section>

              <section class="lt-form-stage">
                <h2 class="lt-form-head">Pricing & Mileage</h2>
                <div class="lt-field-grid two">
                  <div>
                    <label for="car-price">Price (10k CNY)</label>
                    <input class="input" id="car-price" name="price" type="number" step="0.1" placeholder="e.g. 12.8">
                  </div>
                  <div>
                    <label for="car-mileage">Mileage (km)</label>
                    <input class="input" id="car-mileage" name="mileage" type="number" placeholder="e.g. 46000">
                  </div>
                </div>
              </section>

              <section class="lt-form-stage">
                <h2 class="lt-form-head">Region & Year</h2>
                <div class="lt-field-grid two">
                  <div>
                    <label for="car-city">City</label>
                    <select class="select" id="car-city" name="city">
                      <option>Nationwide</option>
                      <option>Beijing</option>
                      <option>Shanghai</option>
                      <option>Hangzhou</option>
                      <option>Guangzhou</option>
                      <option>Shenzhen</option>
                    </select>
                  </div>
                  <div>
                    <label for="car-year">Registration Year</label>
                    <select class="select" id="car-year" name="year">
                      <option>2024</option>
                      <option>2023</option>
                      <option>2022</option>
                      <option>2021</option>
                      <option>2020</option>
                      <option>2019 and earlier</option>
                    </select>
                  </div>
                </div>
              </section>

              <section class="lt-form-stage">
                <h2 class="lt-form-head">Description</h2>
                <div class="lt-field-grid">
                  <div>
                    <label for="car-desc">Vehicle Description</label>
                    <textarea class="textarea" id="car-desc" name="desc" placeholder="e.g. Full 4S maintenance history, no major accidents, no flood damage."></textarea>
                  </div>
                </div>
                <div class="lt-row-actions">
                  <button class="btn btn-success" type="submit">Submit for Review</button>
                  <button class="btn btn-ghost" type="reset">Reset</button>
                </div>
              </section>
            </form>
          </div>
        </article>
      </section>
    </section>
  </main>
</body>
</html>
