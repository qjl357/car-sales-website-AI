<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#46f6ff Color Preview</title>
  <style>
    :root {
      --c-main: #46f6ff;
      --c-deep: #0ea9b3;
      --c-soft: #dffcff;
      --c-text: #13343a;
      --c-border: #8ce4ea;
      --c-white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Futura", "Futura PT", "Century Gothic", "Avenir Next", "Avenir", "Trebuchet MS", sans-serif;
      background: linear-gradient(160deg, #b4fafd 0%, #46f6ff 45%, #19dce6 100%);
      color: var(--c-text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(900px, 100%);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(16, 122, 130, 0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .code {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--c-soft);
      border: 1px solid var(--c-border);
      font-weight: 700;
    }

    .swatches {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .swatch {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(19, 52, 58, 0.15);
      background: #fff;
    }

    .swatch-color {
      height: 80px;
    }

    .swatch-info {
      padding: 10px;
      font-size: 13px;
    }

    .demo {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }

    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 14px;
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-main {
      background: var(--c-main);
      color: #00353a;
    }

    .btn-deep {
      background: var(--c-deep);
      color: #fff;
    }

    .btn-soft {
      background: var(--c-soft);
      color: #0d4f56;
      border: 1px solid var(--c-border);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--c-border);
      outline: none;
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      .demo { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>#46f6ff Color Preview</h1>
    <div>Current primary color: <span class="code">#46f6ff</span></div>

    <section class="swatches">
      <article class="swatch">
        <div class="swatch-color" style="background:#46f6ff"></div>
        <div class="swatch-info">Primary #46f6ff</div>
      </article>
      <article class="swatch">
        <div class="swatch-color" style="background:#dffcff"></div>
        <div class="swatch-info">Light #dffcff</div>
      </article>
      <article class="swatch">
        <div class="swatch-color" style="background:#0ea9b3"></div>
        <div class="swatch-info">Deep #0ea9b3</div>
      </article>
      <article class="swatch">
        <div class="swatch-color" style="background:linear-gradient(160deg,#b4fafd 0%,#46f6ff 45%,#19dce6 100%)"></div>
        <div class="swatch-info">Background Gradient Sample</div>
      </article>
    </section>

    <section class="demo">
      <div class="card">
        <strong>Button Styles</strong>
        <div class="btns">
          <button class="btn-main">Primary</button>
          <button class="btn-deep">Deep</button>
          <button class="btn-soft">Soft</button>
        </div>
      </div>
      <div class="card">
        <strong>Input Style</strong>
        <input placeholder="Type something to check contrast">
      </div>
    </section>
  </main>
</body>
</html>
