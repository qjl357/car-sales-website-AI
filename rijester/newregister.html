<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Register</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>

<div class="page-shell">
  <!-- 顶部导航（和你们项目完全一样） -->
  <div class="top-nav home-top-nav">
    <div class="brand">Used Cars</div>
    <div class="nav-links">
      <a href="home.html" class="nav-link">Home</a>
      <a href="discovery.html" class="nav-link">Discover</a>
      <a href="register.html" class="nav-link active">Register</a>
    </div>
  </div>

  <!-- 注册表单（和你们项目风格完全统一） -->
  <div class="auth-wrap">
    <div class="card">
      <h2 style="text-align:center; margin-bottom:20px;">Seller Register</h2>

      <div class="form-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" class="input" placeholder="Your full name">
        </div>

        <div class="field">
          <label>Address</label>
          <input type="text" class="input" placeholder="Your address">
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="text" class="input" placeholder="Your phone">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="text" class="input" placeholder="Your email">
        </div>

        <div class="field">
          <label>Username</label>
          <input type="text" class="input" placeholder="Choose username">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" class="input" placeholder="Your password">
        </div>
      </div>

      <div style="margin-top:20px;">
        <button class="btn btn-primary" style="width:100%;">Register</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
