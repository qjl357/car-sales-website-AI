<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Register</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>

<main class="page-shell lt-shell">
  <header class="lt-topbar">
    <a class="lt-back" href="home.html" aria-label="Back to home">‹</a>
    <div class="lt-brand-block">
      <p class="lt-brand">Account Management</p>
      <h1>User Access Console</h1>
    </div>
    <nav class="lt-nav">
      <a class="lt-nav-link" href="home.html">Home</a>
      <a class="lt-nav-link" href="add car ai.html">Publish</a>
      <a class="lt-nav-link" href="login.html">Login</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h2 style="text-align:center; margin-bottom:20px;">Seller Register</h2>

      <div class="form-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" class="input" placeholder="Your full name">
        </div>

        <div class="field">
          <label>Address</label>
          <input type="text" class="input" placeholder="Your address">
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="text" class="input" placeholder="Your phone">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="text" class="input" placeholder="Your email">
        </div>

        <div class="field">
          <label>Username</label>
          <input type="text" class="input" placeholder="Choose username">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" class="input" placeholder="Your password">
        </div>
      </div>

      <div style="margin-top:20px;">
        <button class="btn btn-primary" style="width:100%;">Register</button>
      </div>
    </div>
  </div>
</main>

</body>
</html>
